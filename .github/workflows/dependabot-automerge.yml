name: Dependabot Automerge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-safe-dependabot-pr:
    name: Merge Dependabot patch digests
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Merge if PR is a Dependabot patch group
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request attached to this workflow run."
            exit 0
          fi

          PR_JSON="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          AUTHOR="$(echo "$PR_JSON" | jq -r '.user.login')"
          TITLE="$(echo "$PR_JSON" | jq -r '.title')"
          HEAD_REF="$(echo "$PR_JSON" | jq -r '.head.ref')"
          DRAFT="$(echo "$PR_JSON" | jq -r '.draft')"
          STATE="$(echo "$PR_JSON" | jq -r '.state')"

          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "Not a Dependabot PR ($AUTHOR)."
            exit 0
          fi

          if [ "$DRAFT" = "true" ] || [ "$STATE" != "open" ]; then
            echo "PR is draft or not open."
            exit 0
          fi

          # Only auto-merge grouped patch digests (see .github/dependabot.yml).
          case "$HEAD_REF" in
            *patch-updates*|*patch_updates*) ;;
            *)
              echo "Not a patch-updates Dependabot branch: $HEAD_REF"
              exit 0
              ;;
          esac

          echo "Merging Dependabot patch PR #$PR_NUMBER ($TITLE)."
          gh pr merge --repo "$REPO" --squash --delete-branch "$PR_NUMBER"
