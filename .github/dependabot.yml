# Quiet Dependabot: monthly patch digests only.
# Security alerts stay enabled in GitHub → Security (independent of this file).
# Majors/minors are intentional upgrades — do not auto-open PRs for them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      frontend-patch-updates:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
      day: monday
      time: "06:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      backend-patch-updates:
        patterns:
          - "*"
        update-types:
          - patch
